# Builds the LukeOS Mac app (desktop/) on a Mac. Every build is attached to the
# run; builds from main also go on the "LukeOS for Mac" release for download.
name: Mac app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/mac-app.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: LukeOS-mac
          path: desktop/dist/*.dmg
      - name: Put it on the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-app >/dev/null 2>&1 || gh release create mac-app --target "$GITHUB_SHA" --title "LukeOS for Mac" --notes "The latest build of the Mac app. LukeOS-arm64.dmg is for Apple silicon Macs (M1 and later), LukeOS-x64.dmg for older Intel Macs." --latest=false
          gh release upload mac-app desktop/dist/*.dmg --clobber
