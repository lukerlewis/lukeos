name: LukeOS
options:
  bundleIdPrefix: com.lewisdesign
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 563YN34NMT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # The LukeOS server. Override per build (e.g. LUKEOS_BASE_URL=http://localhost:3000) for a local server.
    LUKEOS_BASE_URL: https://lukeos-kappa.vercel.app
targets:
  LukeOS:
    type: application
    platform: iOS
    sources:
      - path: LukeOS
      - path: Shared
      - path: ScreenTime/Shared
      - path: Fixtures
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos
        PRODUCT_NAME: LukeOS
        INFOPLIST_FILE: LukeOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LukeOS/Resources/LukeOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: LukeOSWidgets
      - target: LukeOSShare
      - target: LukeOSScreenTimeMonitor
      - target: LukeOSScreenTimeShield
  # Screen Time: locks the picked apps again at the start of each day, without the app running.
  LukeOSScreenTimeMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenTime/Monitor
      - path: ScreenTime/Shared
      - path: Shared/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.screentime-monitor
        PRODUCT_NAME: LukeOSScreenTimeMonitor
        INFOPLIST_FILE: ScreenTime/Monitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenTime/Monitor/Monitor.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  # Screen Time: the screen shown over a blocked app.
  LukeOSScreenTimeShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenTime/Shield
      - path: ScreenTime/Shared
      - path: Shared/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.screentime-shield
        PRODUCT_NAME: LukeOSScreenTimeShield
        INFOPLIST_FILE: ScreenTime/Shield/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenTime/Shield/Shield.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  LukeOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: LukeOS/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.widgets
        PRODUCT_NAME: LukeOSWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LukeOSShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.share
        PRODUCT_NAME: LukeOSShare
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
        # NSItemProvider isn't Sendable; the extension runs one short task, so Swift 5 checking is enough.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  LukeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LukeOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.tests
schemes:
  LukeOS:
    build:
      targets:
        LukeOS: all
    run:
      config: Debug
    test:
      targets:
        - LukeOSTests
  LukeOS Demo:
    build:
      targets:
        LukeOS: all
    run:
      config: Debug
      commandLineArguments:
        "-demo": true
