name: LukeOS
options:
  bundleIdPrefix: com.lewisdesign
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 563YN34NMT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # The LukeOS server. Override per build (e.g. LUKEOS_BASE_URL=http://localhost:3000) for a local server.
    LUKEOS_BASE_URL: https://lukeos-kappa.vercel.app
packages:
  # Whisper speech-to-text that runs on the phone (dictation). Free and open source.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "1.1.1"
targets:
  LukeOS:
    type: application
    platform: iOS
    sources:
      - path: LukeOS
      - path: Shared
      - path: Fixtures
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos
        PRODUCT_NAME: LukeOS
        INFOPLIST_FILE: LukeOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LukeOS/Resources/LukeOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: LukeOSWidgets
      - target: LukeOSShare
      - target: LukeOSKeyboard
      - package: WhisperKit
        product: WhisperKit
  LukeOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: LukeOS/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.widgets
        PRODUCT_NAME: LukeOSWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LukeOSShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.share
        PRODUCT_NAME: LukeOSShare
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
        # NSItemProvider isn't Sendable; the extension runs one short task, so Swift 5 checking is enough.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  LukeOSKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      - path: LukeOS/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.keyboard
        PRODUCT_NAME: LukeOSKeyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # UIKit's keyboard classes predate Swift 6 checking; the keyboard is one small screen.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  LukeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LukeOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lewisdesign.lukeos.tests
schemes:
  LukeOS:
    build:
      targets:
        LukeOS: all
    run:
      config: Debug
    test:
      targets:
        - LukeOSTests
  LukeOS Demo:
    build:
      targets:
        LukeOS: all
    run:
      config: Debug
      commandLineArguments:
        "-demo": true
